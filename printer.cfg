[output_pin PWC_ON]
pin: PB10
value: 1

  

[virtual_sdcard]
path: /home/voron/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[shaketune]

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 11000
max_z_velocity: 20
max_z_accel: 1000
square_corner_velocity: 5.0


[pause_resume]

[display_status]
[exclude_object]


[idle_timeout]
timeout: 36000

[force_move]
enable_force_move: True

[bed_mesh]
zero_reference_position:127,127
speed: 300
horizontal_move_z: 2
mesh_min: 25,25
mesh_max: 220,220
probe_count: 100, 22
algorithm: bicubic

[quad_gantry_level]
gantry_corners:
	-73,-5
    290,330
##	Probe points
points:
	30,  0           
         30, 180
		 200, 180
		 200, 0
speed: 300
horizontal_move_z: 2
retries: 2
retry_tolerance: 0.1
max_adjust: 30


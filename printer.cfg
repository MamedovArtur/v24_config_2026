[mcu]
# serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0D0036001551313433343333-if00
canbus_uuid: 2ccfd57434a1
canbus_interface: can0

[mcu scanner]
canbus_uuid: 0b287617ea70

[gcode_button BUTTON_AUTOSHUTDOWN]
pin: ^!PD14
press_gcode: PW_OFF_PRINTER





[gcode_macro PW_OFF_PRINTER]
variable_init: 0 
gcode:
	{% set state = printer['gcode_macro PW_OFF_PRINTER'] %}
	{% set init_btn = state.init|default(0)|int %}
	{% if init_btn == 1 %}
		RESPOND PREFIX=PWR MSG="Shoutdown"
		SET_PIN PIN=PWC_ON VALUE=0
	{% else %}
		RESPOND PREFIX=PWR MSG="Init"
		SET_GCODE_VARIABLE MACRO=PW_OFF_PRINTER VARIABLE=init VALUE=1
	{% endif %}


[mcu ebbsb]
canbus_uuid: 8fc79a36ab41
canbus_interface: can0

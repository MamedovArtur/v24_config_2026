[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 64
#rotation_distance: 32
rotation_distance: 40
full_steps_per_rotation: 200
# endstop_pin: tmc2209_stepper_x:virtual_endstop

endstop_pin: ^ebbsb:gpio24
# endstop_pin: ^ebb:PB6
position_min: -10
position_endstop: 254
position_max: 254
homing_speed: 70
homing_retract_dist: 0
step_pulse_duration: 0.000002
homing_positive_dir: true


[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
#rotation_distance: 32
rotation_distance: 40
full_steps_per_rotation: 200
# endstop_pin: ^PF3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -3
position_endstop: 265
position_max: 265
homing_speed: 70
homing_retract_dist: 0
step_pulse_duration: 0.000002

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -5
homing_speed: 8
second_homing_speed: 3
step_pulse_duration: 0.000001
homing_retract_dist: 0

[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps:32
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
step_pulse_duration: 0.000001

[stepper_z2]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
gear_ratio: 80:16
step_pulse_duration: 0.000001

[stepper_z3]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11 
microsteps:32
rotation_distance:40
full_steps_per_rotation: 200
gear_ratio:80:16
step_pulse_duration: 0.000001


## Motor7 (extruder)
[manual_stepper mmu_extruder]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
rotation_distance: 21
full_steps_per_rotation: 200
microsteps: 8

## Motor8 (camschaft)
[manual_stepper mmu_camshaft]
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
rotation_distance: 360
microsteps: 1

##[manual_stepper]¶
# The following command is available when a manual_stepper config section is enabled.

# MANUAL_STEPPER¶
# MANUAL_STEPPER STEPPER=config_name [ENABLE=[0|1]] [SET_POSITION=<pos>] [SPEED=<speed>] [ACCEL=<accel>] [MOVE=<pos> [STOP_ON_ENDSTOP=[1|2|-1|-2]] [SYNC=0]]: This command will alter the state of the stepper. Use the ENABLE parameter to enable/disable the stepper. Use the SET_POSITION parameter to force the stepper to think it is at the given position. Use the MOVE parameter to request a movement to the given position. If SPEED and/or ACCEL is specified then the given values will be used instead of the defaults specified in the config file. If an ACCEL of zero is specified then no acceleration will be performed. If STOP_ON_ENDSTOP=1 is specified then the move will end early should the endstop report as triggered (use STOP_ON_ENDSTOP=2 to complete the move without error even if the endstop does not trigger, use -1 or -2 to stop when the endstop reports not triggered). Normally future G-Code commands will be scheduled to run after the stepper move completes, however if a manual stepper move uses SYNC=0 then future G-Code movement commands may run in parallel with the stepper movement.

# MANUAL_STEPPER STEPPER=config_name GCODE_AXIS=[A-Z] [LIMIT_VELOCITY=<velocity>] [LIMIT_ACCEL=<accel>] [INSTANTANEOUS_CORNER_VELOCITY=<velocity>]: If the GCODE_AXIS parameter is specified then it configures the stepper motor as an extra axis on G1 move commands. For example, if one were to issue a MANUAL_STEPPER ... GCODE_AXIS=R command then one could issue commands like G1 X10 Y20 R30 to move the stepper motor. The resulting moves will occur synchronously with the associated toolhead xyz movements. If the motor is associated with a GCODE_AXIS then one may no longer issue movements using the above MANUAL_STEPPER command - one may unregister the stepper with a MANUAL_STEPPER ... GCODE_AXIS= command to resume manual control of the motor. The LIMIT_VELOCITY and LIMIT_ACCEL parameters allow one to reduce the speed of G1 moves if those moves would result in a velocity or acceleration above the specified limits. The INSTANTANEOUS_CORNER_VELOCITY specifies the maximum instantaneous velocity change (in mm/s) of the motor during the junction of two moves (the default is 1mm/s).


## Motor7
[tmc5160 manual_stepper mmu_extruder]
cs_pin: PD5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 1.8
stealthchop_threshold: 0

## Motor8
[tmc5160 manual_stepper mmu_camshaft]
cs_pin: PC6
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 1.4
hold_current: 1
stealthchop_threshold: 0


[gcode_macro MMU_HOME]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
   
    MANUAL_STEPPER STEPPER=mmu_camshaft SPEED=100 MOVE=-290
    MANUAL_STEPPER STEPPER=mmu_camshaft SET_POSITION=0
    MANUAL_STEPPER STEPPER=mmu_camshaft SPEED=6 MOVE=6
    MANUAL_STEPPER STEPPER=mmu_camshaft SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=home VALUE=1
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=active_ch VALUE=-1


[gcode_macro MMU_CH]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = params.CH|default(0)|int %}
    {% set speed = 500|int %}
    {% if state.home==0 %}
        MMU_HOME
    {% endif %}
    {% if ch == state.active_ch %}
        RESPOND PREFIX="MMU:" MSG="CHANNEL {ch} ALREADY SELECTED"
    {% else %}
        SET_TMC_CURRENT STEPPER=mmu_extruder CURRENT=2.2
        {% if ch == 0 %}
            MANUAL_STEPPER STEPPER=mmu_camshaft SPEED={speed} MOVE=90
        {% elif ch == 1 %}
            MANUAL_STEPPER STEPPER=mmu_camshaft SPEED={speed} MOVE=270
        {% elif ch == 2 %}
            MANUAL_STEPPER STEPPER=mmu_camshaft SPEED={speed} MOVE=0
        {% elif ch == 3 %}
            MANUAL_STEPPER STEPPER=mmu_camshaft SPEED={speed} MOVE=180
        {% elif ch == state.noch %}
        #need replace this pos after full build, currently is ch2
            MANUAL_STEPPER STEPPER=mmu_camshaft SPEED={speed} MOVE=0
            SET_TMC_CURRENT STEPPER=mmu_extruder CURRENT=0.8
        {% else %}
            RESPOND PREFIX="MMU:" MSG=" Unknown CH: {ch}"
        {% endif %}
        MMU_STATE
        SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=active_ch VALUE={ch}
    {% endif %}


[gcode_macro MMU_LOAD]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = params.CH|default(state.active_ch)|int %}
    {% if ch == 0 or ch == 1 %}
        {% if state.active_ch!=ch %}
            MMU_CH CH={ch}
        {% endif %}
        MMU_LOAD_TO_SENSOR
    {% else %}
        RESPOND PREFIX="MMU:" MSG="load error, unknown or unselected CH: {ch}"
    {% endif %}

[gcode_macro MMU_UNLOAD]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = params.CH|default(state.active_ch)|int %}
    {% set len = -(state.unload_len|int) %}
    {% if ch == 0 or ch == 1 %}
        RESPOND PREFIX="MMU:" MSG="unload filament from mmu ch: {ch}"
        MMU_CH CH={ch}
        MMU_MOVE E={len} SYNC=1 SPEED={state.load_speed}
    {% else %}
        RESPOND PREFIX="MMU:" MSG="unload error, unknown or unselected CH: {ch}"
    {% endif %}

[gcode_macro MMU_LOAD_EXTRUDER]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = state.active_ch %}
    {% set purge = state.purge|int %}
    {% set pre_purge = state.pre_purge %}
    {% set purge_cnt = state.purge_repeat|int %}
    {% if ch == 0 or ch == 1 %}
        G90
        G1 X30 Y260 F15000
        MMU_MOVE E={state.load_len} SYNC=0 SPEED=15
        G92 E0
        G1 E{state.load_len} F1500
        G1 E30
        MMU_CH CH={state.noch}
        M106 S255
        RESPOND PREFIX="MMU:" MSG="PURGE"
        G92 E0
        G1 E{pre_purge} F1500
        {% for i in range(0, purge_cnt) %}
            G1 E{purge} F1500
        {% endfor %}
        G1 E-2 F1500
        G90
        G1 X80 F15000
        G1 X60 F15000
        G1 X80 F15000
        G1 X65 F15000
        G1 Y255 F15000
       
    {% else %}
        RESPOND PREFIX="MMU:" MSG="Extruder load error, unselected channel"
    {% endif %}
[gcode_macro MMU_UNLOAD_EXTRUDER]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = state.active_ch %}
    {% set len = -(state.unload_len|int) %}
    {% if ch == 0 or ch == 1 %}
        MMU_CH CH={state.noch}
        G92 E0
        G1 E5 F1000
        G1 E-70 F1000
        MMU_CH CH={ch}
        MMU_UNLOAD_TO_SENSOR
    {% else %}
        RESPOND PREFIX="MMU:" MSG="Extruder load error, unselected channel"
    {% endif %}

[gcode_macro MMU_UNLOAD_TO_SENSOR]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set max_len = 100|int %}
    RESPOND PREFIX="MMU:" MSG="Unloading fillament to sensor"

    {% for i in range(0, max_len, 5) %}
        _MMU_MOVE_IF_FILAMENT_DETECTED E=-5
    {% endfor %}



[gcode_macro MMU_LOAD_TO_SENSOR]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set max_len = state.bowden_len|int %}
    RESPOND PREFIX="MMU:" MSG="Load fillament to sensor"
    {% for i in range(0, max_len, 5) %}
        _MMU_MOVE_IF_FILAMENT_NOT_DETECTED E=5
    {% endfor %}
    RESPOND PREFIX="MMU:" MSG="Load fillament to sensor complete"
    

[gcode_macro _MMU_MOVE_IF_FILAMENT_DETECTED]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set e = params.E|default(0)|int %}
    {% if sensor.filament_detected %}
      MMU_MOVE E={e} SYNC=1
    {% endif %}

[gcode_macro _MMU_MOVE_IF_FILAMENT_NOT_DETECTED]
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set e = params.E|default(0)|int %}
    {% if not sensor.filament_detected %}
      MMU_MOVE E={e} SYNC=1
    {% endif %}

[gcode_macro MMU_CHANGE]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = params.CH|default(0)|int %}
    {% if ch == state.loaded_ch %}
        RESPOND PREFIX="MMU:" MSG="Channel already active {ch}"
    {% else %}
        G91
        G1 Z5 F1000
        {% if state.loaded_ch!=-1 and state.loaded_ch!=2%}
            MMU_CH CH={state.loaded_ch}
            MMU_UNLOAD_EXTRUDER
            MMU_UNLOAD
        {% endif %}
        {% if not ch==state.noch %}
            MMU_LOAD CH={ch}
            MMU_LOAD_EXTRUDER
        {% endif %}
        SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=loaded_ch VALUE={ch}
        MMU_CH CH={state.noch}
        G91
        G1 Z-5 F1000
    {% endif %}
    

[gcode_macro MMU_CUT]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set cx = state.cut_x|int %}
    {% set cx0 = state.cut_x_pos|int %}
    {% set cy = state.cut_y|int %}
    G91
    G1 Z5 F1000
    G90
    G1 X{cx0} Y{cy} F10000
    G92 E0
    G1 E-20 F1500
    G90
    G1 X{cx} F500
    G92 E0
    G1 E-1 F1500
    G1 X{cx0} Y{cy} F10000
    G91
    G1 Z-5 F1000

[gcode_macro MMU_MOVE]
gcode:
    
    {% set s = params.SYNC|default(1) %}
    {% set speed = params.SPEED|default(50) %}
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% if state.active_ch==1 or state.active_ch==3%}
        {% set e = -(params.E|int) %}
    {% else %}
        {% set e = params.E|int %}
    {% endif %}
    MANUAL_STEPPER STEPPER=mmu_extruder SET_POSITION=0 
    MANUAL_STEPPER STEPPER=mmu_extruder SPEED={speed} MOVE={e} SYNC={s}

[gcode_macro MMU_RESET]
gcode:
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=active_ch VALUE=-1
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=loaded_ch VALUE=-1
    MMU_STATE

[gcode_macro MMU_SET_LOADED]
gcode:
    {% set ch = params.CH|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=loaded_ch VALUE={ch}
    MMU_STATE

[gcode_macro MMU_ENABLE]
gcode:
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=enabled VALUE=1
    MMU_STATE

[gcode_macro MMU_DISABLE]
gcode:
    SET_GCODE_VARIABLE MACRO=MMU_STATE VARIABLE=enabled VALUE=0
    MMU_STATE
    
[gcode_macro TOOL]
gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    {% set ch = params.T|default(0)|int %}
    {% if ch != state.loaded_ch and state.enabled == 1%}
        SAVE_GCODE_STATE NAME=TOOLCHANGE_state
        {% if not state.loaded_ch == -1 %}
            MMU_CUT
        {% endif %}
        MMU_CHANGE CH={ch}
        RESTORE_GCODE_STATE NAME=TOOLCHANGE_state
    {%endif%}


[gcode_macro T0]
gcode:
    TOOL T=0
    
[gcode_macro T1]
gcode:
    TOOL T=1

[gcode_macro MMU_STATE]
#state, not change
variable_home: 0              
variable_active_ch: -1 # unselected = -2
variable_loaded_ch: -1
variable_enabled: 0
#config:
variable_bowden_len: 1200
variable_load_len: 30
variable_unload_len: 130
variable_load_speed: 70
variable_pre_purge: 100
variable_purge: 100
variable_purge_repeat: 1

variable_cut_x_pos: 10
variable_cut_x: -8
variable_cut_y: 0
#const
variable_noch: -2

gcode:
    {% set state = printer['gcode_macro MMU_STATE'] %}
    RESPOND PREFIX="MMU:" MSG=" enabled: [{state.enabled}], loaded [{state.loaded_ch}], active [{state.active_ch}]"
    
[cartographer]
mcu: scanner
x_offset: 0 
y_offset: 24
verbose: no # For extra output

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 5
max_temp: 105


[safe_z_home]
home_xy_position: 125,125 
speed: 100
z_hop: 10                 # Move up 10mm
z_hop_speed: 5



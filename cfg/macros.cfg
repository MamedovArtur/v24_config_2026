[gcode_macro sl_red]
gcode:
    SET_LED LED=hotend_rgb RED=0.05 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=1 SYNC=0
 
[gcode_macro sl_blue]
gcode:
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0.05  INDEX=1 TRANSMIT=1 SYNC=0

[gcode_macro sl_green]
gcode:
    SET_LED LED=hotend_rgb RED=0 GREEN=0.5 BLUE=0.0  INDEX=1 TRANSMIT=1 SYNC=0

[gcode_macro sl_yellow]
gcode:
    SET_LED LED=hotend_rgb RED=0.05 GREEN=0.05 BLUE=0  INDEX=1 TRANSMIT=1 SYNC=0

[gcode_macro sl_white]
gcode:
    SET_LED LED=hotend_rgb RED=0.1 GREEN=0.1 BLUE=0.1  INDEX=1 TRANSMIT=1 SYNC=0

[gcode_macro ex_light_on]
gcode:
    SET_LED LED=hotend_rgb RED=0.5 GREEN=0.5 BLUE=0.5 INDEX=2 TRANSMIT=1 SYNC=0
    SET_LED LED=hotend_rgb RED=0.5 GREEN=0.5 BLUE=0.5 INDEX=3 TRANSMIT=1 SYNC=0
[gcode_macro ex_light_off]
gcode:
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0  INDEX=2 TRANSMIT=1 SYNC=0
    SET_LED LED=hotend_rgb RED=0 GREEN=0 BLUE=0  INDEX=3 TRANSMIT=1 SYNC=0
   
[gcode_macro SILENT_MODE]
gcode:
    {% set en = params.EN|default(1)|int %}
    {% if en == 1 %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
        SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
    {% else %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1
        SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1
    {% endif %}
 
[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    # Z_TILT_ADJUST
    QUAD_GANTRY_LEVEL
    CARTOGRAPHER_TOUCH_HOME
# resonance tester
[gcode_macro RESONANCE_FULL_TEST]
gcode:
    RUN_SHELL_COMMAND CMD=clean_resonance
    TEST_RESONANCES AXIS=X
    TEST_RESONANCES AXIS=Y
    RUN_SHELL_COMMAND CMD=exposrt_resonance

# [gcode_shell_command exposrt_resonance]
# command: sh /home/blv/scripts/export_resonance.sh
# timeout: 100
# verbose: True

# [gcode_shell_command clean_resonance]
# command: sh /home/blv/scripts/clean_resonance.sh
# timeout: 100
# verbose: True


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set purge_speed = params.PURGE_SPEED|default(300) %}  # Speed in mm/min for purging filament
    {% set target_temp = params.TARGET_TEMP|default(250) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(220) %}  # Minimum safe temperature for extrusion
    {% set speed = params.LOAD_SPEED|default(1500) %}
    # {% if target_temp >= min_temp %}
    #     M104 S{target_temp} ; Set extruder to target temperature
    #     M109 S{target_temp} ; Wait for extruder to reach target temperature
    # {% else %}
    #     # Heat to minimum temperature first if target is too low
    #     M104 S{min_temp} ; Set extruder to safe minimum temperature
    #     M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
    # {% endif %}
    G91
    G92 E0
    G1 E75 F{speed} # fast-load
    G1 E30 F{purge_speed} # purge

[gcode_macro CUSTOM_PAUSE]
gcode:
    {% set px = 100 %}
    {% set py = 10 %}
    {% set zh = 10 %}

    SAVE_GCODE_STATE NAME=PAUSE_state
    G91
    G1 Z{zh} F600
    G90
    G1 X{px} Y{py} F6000

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    CUSTOM_PAUSE

[gcode_macro UNLOAD_FILAMENT]
variable_load_distance: 40         # Distance to load filament into the extruder
variable_purge_distance: 50        # Distance to purge filament after loading
variable_nozzle_preheat_temp: 250  # Default preheat temperature for the nozzle
variable_turn_off_extruder: True   # Option to turn off the extruder after loading (True/False)
gcode:
    {% set speed = params.LOAD_SPEED|default(1000) %}
    G91
    G92 E0
    G1 E-100 F{speed} 
    G1 E-20 F{speed} 



#print operation
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    sl_red
    TURN_OFF_HEATERS
    G91
    G1 Z10
    G90 
    G1 X220 Y220
    G28 X
    CANCEL_PRINT_BASE
    EX_LIGHT_OFF
  
[gcode_macro PRINT_END]
gcode:
    sl_green
    TURN_OFF_HEATERS
    G91
    G1 Z10
    G90 
    G1 X220 Y220
    G28 X
    EX_LIGHT_OFF

[gcode_macro PRINT_START]
gcode: 
    EX_LIGHT_ON
    sl_yellow
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    {% set OFFSET = params.OFFSET|default(0.00) %}
    sl_white
    # Прогрев стола и частичный нагрев экструдера
    SET_GCODE_OFFSET Z=0
    M104 S150
    M190 S{BED_TEMP} ; Ожидание нагрева стола
    M109 S150
    sl_red
    # Парковка и калибровка
    G32
    BED_MESH_CALIBRATE ADAPTIVE=1 
    G90
    # Полный нагрев экструдера
    G1 X-2 Y-3 Z0.4 F3000 ; Перемещение в точку (0, 300, 20) для ожидания полного нагрева
    M104 S{EXTRUDER_TEMP} ; Полный нагрев экструдера
    M109 S{EXTRUDER_TEMP} ; Ожидание нагрева экструдера до полной температуры
     # Очистка сопла
    G92 E0 
    G1 X240 Y-3 Z0.2 E15 F5000 ; Перемещение к точке (300, 0)
    G1 X120 Y-2.6 E15 F1000 ; Экструзия линии к точке (0, 5)
    sl_blue
    SET_GCODE_OFFSET Z={OFFSET}
    # Начало печати
    G92 E0 
    G1 Z0.2 F3000 ; Установка начальной высоты



[gcode_macro _HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
     _CLIENT_LINEAR_MOVE X=-10 F=7800
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P500
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    _CLIENT_LINEAR_MOVE Y=-10 F=7800

    # Wait just a second… (give StallGuard registers time to clear)
    G4 P500
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[gcode_macro PID_TABLE_GEN]
description: "Генерирует таблицу PID-коэффициентов для указанного нагревателя с отображением прогресса"
variable_heater: ""
variable_temp_start: 0
variable_temp_end: 0
gcode:
    {% set temp_start = params.TEMP_START|int %}
    {% set temp_end = params.TEMP_END|int %}
    {% set heater = params.HEATER|string %}
    {% set steps = (temp_end - temp_start) // 10 + 1 %}
    {% set i = 0 %}

    M117 "PID Калибровка: 0% [          ]"

    {% for temp in range(temp_start, temp_end + 1, 10) %}
        # Ожидание завершения калибровки
        M117 "Ожидание завершения PID-калибровки для {temp}°C..."
        PID_CALIBRATE HEATER={heater} TARGET={temp}

        {action_wait_complete}

        # Получение PID-коэффициентов
        {% set kp_key = heater + "_control_kp" %}
        {% set ki_key = heater + "_control_ki" %}
        {% set kd_key = heater + "_control_kd" %}
        {% set kp = printer.configfile.settings.get(kp_key, 0) %}
        {% set ki = printer.configfile.settings.get(ki_key, 0) %}
        {% set kd = printer.configfile.settings.get(kd_key, 0) %}

        # Запись PID-значений в макрос SET_PID_FROM_TABLE
        SET_GCODE_VARIABLE MACRO=SET_PID_FROM_TABLE VARIABLE=pid_{heater}_{temp} VALUE="{kp}, {ki}, {kd}"
        
        # Обновление прогресса
        {% set progress = ((i + 1) * 100) // steps %}
        {% set filled_blocks = progress // 10 %}
        {% set empty_blocks = 10 - filled_blocks %}
        {% set progress_bar = "█" * filled_blocks + " " * empty_blocks %}
        
        M117 "PID Калибровка: {progress}% [{progress_bar}]"

        {% set i = i + 1 %}
    {% endfor %}
    
    RESPOND INFO "Сохранение настроек PID..."
    SAVE_CONFIG  # Теперь сохраняем один раз в конце

    M117 "PID Калибровка завершена!"



[gcode_macro SET_PID_FROM_TABLE]
description: "Хранит таблицу PID-коэффициентов"
variable_pid_extruder_180: "0, 0, 0"
variable_pid_extruder_190: "0, 0, 0"
variable_pid_extruder_200: "0, 0, 0"
variable_pid_extruder_210: "0, 0, 0"
variable_pid_extruder_220: "0, 0, 0"
variable_pid_extruder_230: "0, 0, 0"
variable_pid_extruder_240: "0, 0, 0"
variable_pid_extruder_250: "0, 0, 0"
variable_pid_extruder_260: "0, 0, 0"
variable_pid_extruder_270: "0, 0, 0"
variable_pid_extruder_280: "0, 0, 0"
variable_heater: ""
variable_temp: 0
gcode:
    {% set heater = params.get("heater")|string %}
    {% set temp = (params.get("temp")|int // 10) * 10 %}  # Округление до ближайших 10°C
    {% set pid_key = "pid_" + heater + "_" + temp|string %}
    {% if printer.configfile.settings[pid_key] is defined %}
        {% set pid_values = printer.configfile.settings[pid_key].split(", ") %}
        SET_HEATER_PID HEATER={heater} KP={pid_values[0]} KI={pid_values[1]} KD={pid_values[2]}
    {% else %}
        M117 "Нет данных PID для {temp}C"
    {% endif %}

